{% extends "base.html" %}{% block title %}Profil — Ayaka Sync{% endblock %}{% block content %}
<div class="page-heading"><div><span class="eyebrow">ACCOUNT SETTINGS</span><h1>Profil member.</h1><p>Kelola informasi akun dan API key provider milikmu.</p></div></div>
